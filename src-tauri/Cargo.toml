[package]
name = "tactica11"
version = "0.20.0"
description = "Tactica11 — compos et analyses tactiques de football"
authors = ["Florent Fougères"]
edition = "2021"
publish = false

[lib]
name = "tactica11_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
